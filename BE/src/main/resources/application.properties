spring.application.name=chat-clone
# Local settings (DB password, model) live in env.properties, ignored by git.
# OS environment variables win over env.properties.
spring.config.import=optional:file:env.properties
spring.threads.virtual.enabled=true

# Listen only on this machine: nobody on the network can use the backend (and the API key)
server.address=127.0.0.1
server.port=8080

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/U5W6D3}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# OpenRouter (OpenAI-compatible chat completions)
openrouter.base-url=https://openrouter.ai/api/v1
# Read from the OPENROUTER_API_KEY environment variable; used only server-side, never sent to clients.
# If missing the app still starts and chat requests return a readable error.
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:}
# Free models are often "temporarily overloaded": temporary errors are retried
# (max-retries extra attempts per model, waiting retry-backoff x attempt), then
# the fallback models are tried in order. Comma-separated, may be empty.
openrouter.fallback-models=${OPENROUTER_FALLBACK_MODELS:nvidia/nemotron-3-ultra-550b-a55b:free}
openrouter.max-retries=2
openrouter.retry-backoff=1500ms
openrouter.timeout=60s
# Model reasons before answering; only the final answer is streamed and saved
openrouter.reasoning-enabled=true
openrouter.app-name=U5W6D3 Chat Clone
openrouter.app-url=http://localhost:5173

# Agent personality and rules, loaded once at startup (use file:... to point outside the jar)
agent.instructions-location=classpath:agent/instructions.md

# Context strategy: only the last N messages of a conversation are sent to the model
chat.history.max-messages=20
chat.stream-timeout=5m

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
